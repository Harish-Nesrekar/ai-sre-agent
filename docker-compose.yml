services:
  postgres:
    networks: [app-network]
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: sre_demo
      POSTGRES_USER: sre_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_user -d sre_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    networks: [app-network]
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    networks: [app-network]
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sre_user:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/sre_demo
      REDIS_URL: redis://redis:6379/0
      STAGING_BASE_URL: ${STAGING_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  demo:
    networks: [app-network]
    build:
      context: ./apps/demo
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - demo_logs:/var/log/sre
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  sandbox-base:
    networks: [sandbox-network]
    image: ai-sre-sandbox-base:latest
    build:
      context: ./sandbox/executor
      dockerfile: Dockerfile
    command: ["python", "-c", "import time; time.sleep(2147483)"]
    restart: unless-stopped

  sandbox-runner:
    networks: [sandbox-network]
    build:
      context: ./sandbox/runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SANDBOX_IMAGE: ai-sre-sandbox-base:latest
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sandbox-base:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    networks: [app-network, sandbox-network]
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./.git:/workspace/.git:ro
      - ./.gitignore:/workspace/.gitignore:ro
      - ./apps:/workspace/apps:ro
      - ./tests:/workspace/tests:ro
      - demo_logs:/var/log/sre:ro
    environment:
      DATABASE_URL: postgresql://sre_user:${POSTGRES_PASSWORD:-local_dev_password}@postgres:5432/sre_demo
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-}
      GEMINI_MAX_ATTEMPTS: ${GEMINI_MAX_ATTEMPTS:-2}
      GEMINI_RETRY_BASE_SECONDS: ${GEMINI_RETRY_BASE_SECONDS:-2}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_RETRY_BASE_SECONDS: ${TASK_RETRY_BASE_SECONDS:-15}
      DEMO_METRICS_URL: http://demo:8000/metrics
      SANDBOX_URL: http://sandbox-runner:9000
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      STAGING_BASE_URL: ${STAGING_BASE_URL:-}
      GIT_OPTIONAL_LOCKS: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      demo:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy

  detector:
    networks: [app-network]
    build:
      context: ./apps/detector
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEMO_METRICS_URL: http://demo:8000/metrics
      INCIDENT_API_URL: http://api:8000/incidents
      POLL_INTERVAL_SECONDS: ${DETECTOR_POLL_INTERVAL_SECONDS:-5}
      SLOW_REQUEST_THRESHOLD_SECONDS: ${SLOW_REQUEST_THRESHOLD_SECONDS:-2}
    depends_on:
      demo:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  postgres_data:
  demo_logs:

networks:
  app-network:
    driver: bridge
  sandbox-network:
    driver: bridge
    internal: true
